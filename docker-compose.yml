version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vuln-scanner-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/vuln_scanner.db
      - JWT_SECRET=dev-secret-key-change-in-production-32chars
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - backend-storage:/app/data
    restart: unless-stopped
    networks:
      - vuln-scanner-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vuln-scanner-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vuln-scanner-network

volumes:
  backend-storage:

networks:
  vuln-scanner-network:
    driver: bridge
